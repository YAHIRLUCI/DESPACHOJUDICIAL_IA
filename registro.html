<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SISTEMA IA DESPACHO - Crear Cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <div class="container">

        <div class="row vh-100 justify-content-center align-items-center">

            <div class="col-md-6">

                <div class="card shadow-lg border-0">

                    <div class="card-header bg-success text-white text-center">

                        <h2 class="mb-0">
                            DESPACHO JURIDICO
                        </h2>

                    </div>

                    <div class="card-body p-4">

                        <h4 class="text-center mb-4">
                            Crear Cuenta
                        </h4>

                        <form action="php/registro.php"
                              method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Nombre Completo
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input type="text"
                                           name="nombre"
                                           class="form-control"
                                           placeholder="Nombre completo"
                                           required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Correo
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input type="email"
                                           name="correo"
                                           class="form-control"
                                           placeholder="correo@ejemplo.com"
                                           required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Contraseña
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input type="password"
                                           name="password"
                                           class="form-control"
                                           placeholder="********"
                                           required>

                                </div>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Rol
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person-badge"></i>
                                    </span>

                                    <select name="rol"
                                            class="form-select"
                                            required>

                                        <option value="">
                                            Seleccionar rol
                                        </option>

                                        <option value="Administrador">
                                            Administrador
                                        </option>

                                        <option value="Empleado">
                                            Empleado
                                        </option>

                                        <option value="Usuario">
                                            Usuario
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <button type="submit"
                                    class="btn btn-success w-100">

                                <i class="bi bi-person-plus"></i>
                                Crear Cuenta

                            </button>

                        </form>

                    </div>

                    <div class="card-footer text-center">

                        ¿Ya tienes cuenta?

                        <a href="login.html">
                            Iniciar Sesión
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
